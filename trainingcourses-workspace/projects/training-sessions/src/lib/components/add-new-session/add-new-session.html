@let coursesItems = trainingCourses();
@let centersItems = trainingCenters();

<div class="flex flex-col gap-4">
  @if (centersItems) {
    <lfpa-select-training-centers [isLoading]="isTrainingCenterLoading()" [trainingCenters]="centersItems" />
  }

  @if (coursesItems) {
    <lfpa-select-training-courses [isLoading]="isTrainingCourseLoading()" [trainingCourses]="coursesItems" />
  }
</div>
